# OpenAPI описание всех доступных эндпоинтов и моделей данных.
openapi: 3.0.3
info:
  title: Bank Card Management API
  description: |
    # Bank Card Management System
    
    REST API для управления банковскими картами, пользователями и операциями.
    
    ## Аутентификация
    
    Для доступа к защищенным эндпоинтам необходимо:
    1. Зарегистрироваться через `/api/auth/sign-up` или войти через `/api/auth/sign-in`
    2. Получить JWT токен
    3. Использовать токен в заголовке `Authorization: Bearer <token>`
    
    ## Роли пользователей
    
    - **USER** - может управлять своими картами, делать переводы
    - **ADMIN** - полный доступ ко всем операциям

  version: 1.0.0
  contact:
    name: Bank API Support
    email: support@bank.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api.bank.com
    description: Production server

tags:
  - name: Authentication
    description: Регистрация и аутентификация пользователей
  - name: Bank Cards
    description: Управление банковскими картами
  - name: Operations
    description: Операции с картами

paths:
  # ========== АУТЕНТИФИКАЦИЯ ==========
  /api/auth/sign-up:
    post:
      tags:
        - Authentication
      summary: Регистрация нового пользователя
      description: Создает нового пользователя в системе и возвращает JWT токен
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSignUpDto'
            example:
              nickname: "john_doe"
              email: "john@example.com"
              password: "mySecretPassword123"
      responses:
        '200':
          description: Успешная регистрация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtAuthResponse'
        '400':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Пользователь уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/auth/sign-in:
    post:
      tags:
        - Authentication
      summary: Вход в систему
      description: Аутентификация пользователя и получение JWT токена
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSignInDto'
            example:
              login: "john_doe"
              password: "mySecretPassword123"
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtAuthResponse'
        '401':
          description: Неверные учетные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  # ========== БАНКОВСКИЕ КАРТЫ (ADMIN) ==========
  /api/cards:
    post:
      tags:
        - Bank Cards
      summary: Создание новой банковской карты
      description: Создает новую банковскую карту. Требует роль ADMIN.
      operationId: createCard
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardCreateRequest'
      responses:
        '201':
          description: Карта успешно создана
          headers:
            Location:
              description: URL созданной карты
              schema:
                type: string
                example: "/api/cards/1"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankCardDTO'
        '400':
          description: Неверные данные карты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

    get:
      tags:
        - Bank Cards
      summary: Получение всех карт
      description: Возвращает список всех банковских карт с пагинацией. Требует роль ADMIN.
      operationId: getAllCards
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Номер страницы (начинается с 0)
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Размер страницы
        - name: sort
          in: query
          schema:
            type: string
          description: Поле для сортировки (формат field,asc|desc)
          example: "createdAt,desc"
      responses:
        '200':
          description: Успешное получение списка карт
          headers:
            X-Total-Count:
              description: Общее количество элементов
              schema:
                type: integer
            Link:
              description: Ссылки для пагинации
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BankCardDTO'

  /api/cards/{id}:
    get:
      tags:
        - Bank Cards
      summary: Получение карты по ID
      description: Возвращает информацию о конкретной банковской карте. Требует роль USER.
      operationId: getCard
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID банковской карты
      responses:
        '200':
          description: Успешное получение карты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankCardDTO'
        '404':
          description: Карта не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

    put:
      tags:
        - Bank Cards
      summary: Обновление карты
      description: Обновляет информацию о банковской карте. Требует роль ADMIN.
      operationId: updateCard
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID банковской карты
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankCardDTO'
      responses:
        '200':
          description: Карта успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankCardDTO'
        '400':
          description: Неверные данные или ID не совпадает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Карта не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

    delete:
      tags:
        - Bank Cards
      summary: Удаление карты
      description: Удаляет банковскую карту по ID. Требует роль ADMIN.
      operationId: deleteCard
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID банковской карты
      responses:
        '204':
          description: Карта успешно удалена
        '404':
          description: Карта не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  # ========== ОПЕРАЦИИ С КАРТАМИ (USER) ==========
  /api/my-cards:
    get:
      tags:
        - Bank Cards
      summary: Получение карт текущего пользователя
      description: Возвращает все банковские карты текущего аутентифицированного пользователя. Требует роль USER.
      operationId: getMyCards
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Номер страницы
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Размер страницы
      responses:
        '200':
          description: Успешное получение карт пользователя
          headers:
            X-Total-Count:
              description: Общее количество карт пользователя
              schema:
                type: integer
            Link:
              description: Ссылки для пагинации
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BankCardDTO'

  /api/cards/transfer:
    post:
      tags:
        - Operations
      summary: Перевод между собственными картами
      description: Перевод средств между картами текущего пользователя. Требует роль USER.
      operationId: transferBetweenCards
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '200':
          description: Перевод успешно выполнен
        '400':
          description: Недостаточно средств, неверные данные или перевод на ту же карту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Попытка перевода с чужой карты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/cards/{id}/block:
    put:
      tags:
        - Operations
      summary: Блокировка карты
      description: Блокирует карту текущего пользователя. Требует роль USER.
      operationId: blockCard
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID банковской карты
      responses:
        '200':
          description: Карта успешно заблокирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankCardDTO'
        '403':
          description: Попытка блокировки чужой карты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Карта не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Введите JWT токен

  schemas:
    # ========== АУТЕНТИФИКАЦИЯ ==========
    UserSignUpDto:
      type: object
      description: Запрос на регистрацию пользователя
      required:
        - nickname
        - email
        - password
      properties:
        nickname:
          type: string
          minLength: 5
          maxLength: 50
          example: "john_doe"
          description: Имя пользователя (уникальное)
        email:
          type: string
          format: email
          minLength: 5
          maxLength: 255
          example: "john@example.com"
          description: Email адрес
        password:
          type: string
          minLength: 5
          maxLength: 255
          example: "mySecretPassword123"
          description: Пароль

    UserSignInDto:
      type: object
      description: Запрос на аутентификацию
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 5
          maxLength: 50
          example: "john_doe"
          description: Имя пользователя или email
        password:
          type: string
          minLength: 5
          maxLength: 255
          example: "mySecretPassword123"
          description: Пароль

    JwtAuthResponse:
      type: object
      description: Ответ с токеном доступа
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiJhZG1pbiIsImV4cCI6MTYyMjUwNj..."
          description: JWT access token

    # ========== БАНКОВСКИЕ КАРТЫ ==========
    BankCardDTO:
      type: object
      description: Данные банковской карты
      required:
        - cardNumber
        - cardHolderName
        - expirationDate
        - status
        - balance
        - userId
      properties:
        id:
          type: integer
          format: int64
          example: 1
          description: Уникальный идентификатор карты
          readOnly: true
        cardNumber:
          type: string
          pattern: '^\d{16}$'
          example: "1234567812345678"
          description: Номер карты (16 цифр)
        cardHolderName:
          type: string
          example: "JOHN DOE"
          description: Имя держателя карты
        expirationDate:
          type: string
          format: date-time
          example: "2025-12-31T23:59:59"
          description: Дата и время окончания действия
        status:
          type: string
          enum: [ACTIVE, BLOCKED, EXPIRED]
          example: "ACTIVE"
          description: Статус карты
        balance:
          type: number
          format: decimal
          minimum: 0
          example: 1500.75
          description: Баланс карты
        maskedCardNumber:
          type: string
          example: "**** **** **** 5678"
          description: Маскированный номер карты
          readOnly: true
        userId:
          type: integer
          format: int64
          example: 1
          description: ID владельца карты

    CardCreateRequest:
      type: object
      description: Запрос на создание банковской карты
      required:
        - cardNumber
        - cardHolderName
        - expirationDate
      properties:
        cardNumber:
          type: string
          pattern: '^\d{16}$'
          example: "1234567812345678"
          description: Номер карты (16 цифр)
        cardHolderName:
          type: string
          example: "JOHN DOE"
          description: Имя держателя карты
        expirationDate:
          type: string
          format: date-time
          example: "2025-12-31T23:59:59"
          description: Дата и время окончания действия
        targetUserId:
          type: integer
          format: int64
          example: 1
          description: ID пользователя-владельца (опционально для админа)

    # ========== ОПЕРАЦИИ ==========
    TransferRequest:
      type: object
      description: Запрос на перевод между картами
      required:
        - fromCardId
        - toCardId
        - amount
      properties:
        fromCardId:
          type: integer
          format: int64
          example: 1
          description: ID карты-отправителя
        toCardId:
          type: integer
          format: int64
          example: 2
          description: ID карты-получателя
        amount:
          type: number
          format: decimal
          minimum: 0.01
          example: 100.50
          description: Сумма перевода (должна быть положительной)

    # ========== ОШИБКИ ==========
    ApiErrorResponse:
      type: object
      description: Стандартный формат ответа об ошибке
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00"
          description: Время возникновения ошибки
        status:
          type: integer
          example: 400
          description: HTTP статус код
        error:
          type: string
          example: "Bad Request"
          description: Описание статуса
        message:
          type: string
          example: "Card number must be 16 digits"
          description: Сообщение об ошибке
        errorCode:
          type: string
          example: "VALIDATION_ERROR"
          description: Код ошибки для программной обработки
        path:
          type: string
          example: "/api/cards"
          description: Путь запроса
        fieldErrors:
          type: array
          description: Ошибки валидации полей (если применимо)
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      description: Ошибка валидации конкретного поля
      properties:
        field:
          type: string
          example: "cardNumber"
          description: Название поля с ошибкой
        message:
          type: string
          example: "Card number must be 16 digits"
          description: Сообщение об ошибке
        rejectedValue:
          type: string
          example: "123"
          description: Отклоненное значение

security:
  - bearerAuth: []