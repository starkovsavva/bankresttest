#
# application.yml — главный конфигурационный файл Spring Boot.

Что нужно сделать:
  - Указать настройки подключения к базе данных.
  - Указать порт приложения.
  - Настроить параметры безопасности и JWT.
  - Включить Swagger UI.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bank_db
    username: bank_user
    password: bank_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    filter: true
  packages-to-scan: com.bank.controller
  paths-to-match: /api/**
  info:
    title: Bank Card Management System API
    description: REST API for managing bank cards and transactions
    version: 1.0.0
    contact:
      name: Bank API Support
      email: support@bank.com
server:
  port: 8080

jwt:
  secret: bank-card-management-system-secret-key-2024
  expiration: 86400000

logging:
  level:
    com.bank: DEBUG
    org.springframework.security: DEBUG