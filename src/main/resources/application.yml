#
# application.yml — главный конфигурационный файл Spring Boot.

#Что нужно сделать:
#  - Указать настройки подключения к базе данных.
#  - Указать порт приложения.
#  - Настроить параметры безопасности и JWT.
#  - Включить Swagger UI.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bank_db
    username: bank_user
    password: bank_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  liquibase:
    change-log: classpath:db/migration/v1.0/db.changelog-master.yaml
    enabled: false
    default-schema: public
    liquibase-schema: public

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    filter: true
  packages-to-scan: com.example.bankcards.controller
  paths-to-match: /api/**
  info:
    title: Bank Card Management System API
    description: REST API for managing bank cards and transactions
    version: 1.0.0
    contact:
      name: Bank API Support
      email: support@bank.com
server:
  port: 8080

jwt:
  secret: bank-card-management-system-secret-key-2024
  expiration: 86400000

logging:
  level:
    com.bank: DEBUG
    org.springframework.security: DEBUG


app:
  encryption:
    secret-key: "your-32-character-base64-secret-key-here"
token:
    signing:
        key: 53A73E5F1C4E0A2D3B5F2D784E6A1B423D6F247D1F6E5C3A596D635A75327855